name: Fixture checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
      - run: uv python install
      - run: corepack enable
      - run: |
          set -o pipefail
          make ci 2>&1 | tee "$RUNNER_TEMP/harnesslab-ci.log"
        env:
          CI_BROWSER_SETUP: "1"
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: fixture-failure-reports
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/harnesslab-ci.log
