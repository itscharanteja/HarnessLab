[project]
name = "harnesslab"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "harnesslab-contracts",
  "harnesslab-runner",
  "harnesslab-mcp",
  "harnesslab-eval",
  "harnesslab-opt",
]

[tool.uv]
package = false
required-version = "==0.13.7"

[tool.uv.workspace]
members = ["services/*", "packages/schemas/generated"]

[tool.uv.sources]
harnesslab-contracts = { workspace = true }
harnesslab-runner = { workspace = true }
harnesslab-mcp = { workspace = true }
harnesslab-eval = { workspace = true }
harnesslab-opt = { workspace = true }

[dependency-groups]
dev = [
  "datamodel-code-generator==0.89.0",
  "httpx==0.28.1",
  "pytest==9.2.0",
  "ruff==0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["packages/schemas/generated/harnesslab_contracts/contracts.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
