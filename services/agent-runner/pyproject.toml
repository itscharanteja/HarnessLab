  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "harnesslab-contracts",
  "harnesslab-mcp",
  "httpx2==2.16.0",
  "langgraph==1.2.20",
  "langgraph-checkpoint==4.3.1",
  "langsmith==0.14.17",
